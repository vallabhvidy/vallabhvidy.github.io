name: Update DSA Stats

on:
  schedule:
    # Runs automatically once every 24 hours at 00:00 UTC (05:30 IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch and update DSA stats
        run: node scripts/update-dsa-stats.mjs

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add static/data/dsa-stats.json static/data/github-stats.json
          if git diff --staged --quiet; then
            echo "No stats changes detected."
          else
            git commit -m "chore(data): auto-update DSA and GitHub stats"
            git push origin main
          fi
