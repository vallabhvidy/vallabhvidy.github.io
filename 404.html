<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Not Found</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css?v=20" />

  <script>
    (function () {
      const mode = localStorage.getItem('theme') || 'dark';
      const palette = localStorage.getItem('theme-palette') || 'catppuccin';
      if (mode === 'light') {
        document.documentElement.classList.remove('dark');
      } else {
        document.documentElement.classList.add('dark');
      }
      document.documentElement.setAttribute('data-theme', palette);
      document.documentElement.setAttribute('data-mode', mode);
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/static/img/avataaars.svg" />
  <link rel="alternate icon" type="image/png" href="/static/img/favicon.png" />
  <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png" />
</head>

<body>

  <header>
    <nav class="nav-container">
      <button onclick="toggleMobileNav()" aria-label="Toggle navigation menu" class="nav-hamburger">
        <svg xmlns="http://www.w3.org/2000/svg" class="hamburger-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
      <div class="nav-links">
        <a href="/" class="nav-link inactive">~/</a>
        <a href="/posts/" class="nav-link inactive">~/posts/</a>
        <a href="/projects/" class="nav-link inactive">~/projects.md</a>
        <a href="/dsa/" class="nav-link inactive">~/dsa.md</a>
        <a href="/about/" class="nav-link inactive">~/about.md</a>
      </div>

      <div class="theme-controls">
        <select id="theme-selector" onchange="changeThemePalette(this.value)" aria-label="Select color palette" class="theme-dropdown">
          <option value="catppuccin">catppuccin</option>
          <option value="gruvbox">gruvbox</option>
          <option value="dracula">dracula</option>
          <option value="nord">nord</option>
          <option value="tokyo-night">tokyo night</option>
        </select>

        <button onclick="toggleTheme()" aria-label="Toggle dark/light mode" class="theme-toggle-btn">
          <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" class="icon hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2m0 14v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M3 12H1m22 0h-2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42M12 7a5 5 0 100 10A5 5 0 0012 7z" />
          </svg>
          <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
        </button>
      </div>
    </nav>
  </header>

  <main class="animate-page" style="text-align: center; padding-top: 3rem;">
    <div style="max-width: 260px; margin: 0 auto 1.5rem; border-radius: 0.5rem; overflow: hidden; border: 1px solid var(--color-ctp-surface); box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15); background-color: var(--color-ctp-bg-alt);">
      <img src="/static/img/cat-on-computer.gif" alt="Cat on computer pixel art" style="width: 100%; height: auto; display: block; image-rendering: pixelated;" />
    </div>
    <h1 class="hero-title" style="font-size: 3rem; margin-bottom: 0.5rem;">404</h1>
    <p style="color: var(--color-ctp-subtext); margin-bottom: 1.5rem;">Error: command or path not found</p>
    <a href="/" class="tree-link" style="font-size: 0.9rem;">cd ~/ (return home)</a>
  </main>

  <footer>
    <div class="footer-container">
      <span>© 2026 Vallabh Vidyasagar</span>
      <div class="footer-links">
        <a href="https://github.com/vallabhvidy" target="_blank" rel="noreferrer">github</a>
        <a href="https://linkedin.com/in/vallabhvidy" target="_blank" rel="noreferrer">linkedin</a>
        <a href="mailto:vallabhvidy10@gmail.com">email</a>
        <a href="/feed.xml">rss</a>
      </div>
    </div>
  </footer>

  <script src="/static/js/theme.js"></script>
</body>

</html>
