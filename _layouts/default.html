<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title | default: "Vallabh Vidyasagar" }}</title>
  <meta name="description"
    content="{{ page.description | default: site.description }}" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css?v=22" />
  <link rel="alternate" type="application/rss+xml" title="Vallabh Vidyasagar" href="/feed.xml" />
  <link rel="me" href="https://mastodon.social/@vallabhvidy" />

  <script>
    (function () {
      const mode = localStorage.getItem('theme') || 'dark';
      const palette = localStorage.getItem('theme-palette') || 'catppuccin';
      if (mode === 'light') {
        document.documentElement.classList.remove('dark');
      } else {
        document.documentElement.classList.add('dark');
      }
      document.documentElement.setAttribute('data-theme', palette);
      document.documentElement.setAttribute('data-mode', mode);
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/static/img/avataaars.svg" />
  <link rel="alternate icon" type="image/png" href="/static/img/favicon.png" />
  <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png" />
</head>

<body>

{% include header.html %}

  <main class="animate-page"{% if page.main_style %} style="{{ page.main_style }}"{% endif %}>
{{ content }}
  </main>

{% include footer.html %}

  <script src="/static/js/theme.js"></script>
  {% if page.extra_script %}
  <script src="{{ page.extra_script }}"></script>
  {% endif %}
</body>

</html>
